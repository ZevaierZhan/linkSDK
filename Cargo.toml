[package]
name = "link-sdk"
version = "0.1.0"
edition = "2021"
publish = false
description = "Personal and household P2P networking and local-first shared data"

[features]
default = ["network", "data"]
network = ["dep:libzt"]
data = ["dep:automerge", "dep:rusqlite"]

[dependencies]
libzt = { package = "link-libzt-sys", path = "native/libzt-sys", optional = true }
automerge = { version = "=0.12.0", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"
getrandom = "0.3"
libc = "0.2"

[[example]]
name = "p2p-echo"
path = "examples/p2p-echo.rs"
required-features = ["network"]

[[example]]
name = "shared-kv"
path = "examples/shared-kv.rs"
required-features = ["network", "data"]
